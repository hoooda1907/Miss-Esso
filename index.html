<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roqaya</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<script src="config.js"></script>
<link rel="apple-touch-icon" id="ati">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@700&family=Tajawal:wght@700&family=Reem+Kufi:wght@700&family=Aref+Ruqaa:wght@700&family=Lalezar&family=Changa:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700&family=El+Messiri:wght@700&family=Lemonada:wght@700&family=Mada:wght@700&family=Harmattan:wght@700&family=Marhey:wght@700&family=Kufam:wght@700&family=Readex+Pro:wght@700&family=Noto+Naskh+Arabic:wght@700&family=Caveat:wght@700&family=Pacifico&family=Rakkas&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c3aed'/%3E%3Ctext x='32' y='42' font-size='26' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3ER%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1f1b2e;--mut:#6b6580;--pri:#7c3aed;--prit:#fff;--bd:#e4dff0;--ok:#16a34a;--no:#dc2626;--lt:#d97706;--soft:#efe9fd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121f;--card:#201b30;--tx:#f1eefb;--mut:#a9a2c0;--pri:#a78bfa;--prit:#1a1030;--bd:#352e4d;--soft:#2c2447;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15121f;--card:#201b30;--tx:#f1eefb;--mut:#a9a2c0;--pri:#a78bfa;--prit:#1a1030;--bd:#352e4d;--soft:#2c2447;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}
header b{font-size:19px;flex:1}
main{padding:0 14px 96px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:17px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
textarea{min-height:100px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pri);color:var(--prit);font-weight:600}
button.g{background:var(--soft);color:var(--pri)}
button.d{background:transparent;color:var(--no);border:1px solid var(--no)}
button.s{padding:6px 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--pri)}
.stat span{font-size:13px;color:var(--mut)}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .n{flex:1;min-width:0}
.it small{color:var(--mut);display:block}
.mk{display:flex;gap:6px}
.mk button{padding:7px 11px;background:var(--soft);color:var(--mut)}
.mk .p.on{background:var(--ok);color:#fff}.mk .a.on{background:var(--no);color:#fff}.mk .l.on{background:var(--lt);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:9px 2px;font-size:12px;font-weight:500}
nav button.on{color:var(--pri);font-weight:700}
nav button i{display:block;font-style:normal;font-size:21px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--soft);color:var(--mut);padding:7px 12px;font-size:14px}
.chips button.on{background:var(--pri);color:var(--prit)}
.msg{padding:10px 12px;border-radius:14px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.msg.u{background:var(--soft)}
.msg.b{background:var(--card);border:1px solid var(--bd)}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .card{width:100%;max-width:380px;text-align:center}
.mut{color:var(--mut);font-size:14px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:20;max-width:90%}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:flex;align-items:center;justify-content:center;padding:18px}

#md{z-index:40}#toast{z-index:50}
#bd{-webkit-user-select:none;user-select:none;position:fixed;inset:0;z-index:30;background:#0f1220;overflow:hidden;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
#st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 64px) 64px calc(var(--safe-b) + 92px) 8px}
#bd.full #st,#bd.pres #st{padding:0}
#bw{position:relative;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.35);overflow:hidden;touch-action:none;background:#fff}
#bd.full #bw,#bd.pres #bw{border-radius:0;box-shadow:none}
#bw canvas{position:absolute;inset:0;width:100%;height:100%}
#hd{touch-action:none}
.tb{position:absolute;top:calc(var(--safe-t) + 8px);left:8px;right:8px;display:flex;gap:2px;align-items:center;background:#262a3a;border-radius:16px;padding:5px 8px;color:#fff;overflow-x:auto;z-index:6}
.tb button,#pb button,.rl button,#cb button{background:none;color:#fff;padding:6px 8px;font-size:19px;border-radius:10px;flex:none}
.tb b{flex:1;min-width:64px;font-size:15px;white-space:nowrap}
#eye{position:absolute;top:calc(var(--safe-t) + 70px);left:8px;z-index:8;opacity:.85;background:#262a3a;color:#fff;border-radius:16px;width:46px;height:46px;padding:0;font-size:20px;border:1px solid #3b4160}
.rl{position:absolute;right:8px;top:calc(var(--safe-t) + 70px);display:flex;flex-direction:column;background:#262a3a;border-radius:18px;padding:5px;gap:2px;overflow-y:auto;max-height:calc(100% - var(--safe-t) - 70px - 100px);z-index:5}
.rl button.on{background:#1f6f66}
.dot{display:block;width:22px;height:22px;border-radius:50%;border:2px solid #fff}
#pb{position:absolute;left:8px;bottom:calc(var(--safe-b) + 14px);display:flex;gap:2px;align-items:center;background:#262a3a;border-radius:18px;padding:5px 8px;color:#fff;z-index:6}
#pb button{padding:6px 5px!important;font-size:17px!important}#pb span{background:#1f6f66;border-radius:10px;padding:4px 8px;font-weight:700;font-size:14px}
#rb{position:absolute;left:50%;bottom:calc(var(--safe-b) + 12px);transform:translateX(-50%);min-width:76px;height:70px;border-radius:35px;background:#dc2626;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 6px 22px rgba(220,38,38,.55);z-index:7;padding:0 16px;line-height:1.1}
#rb i{font-style:normal;font-size:24px}#rb small{font-size:12px;font-weight:700}
#rb.rec{animation:pul 1.3s infinite}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.7)}50%{box-shadow:0 0 0 14px rgba(220,38,38,0)}}
#aib{position:absolute;right:10px;bottom:calc(var(--safe-b) + 14px);min-width:64px;height:64px;border-radius:32px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;line-height:1.1;z-index:6;box-shadow:0 4px 16px rgba(124,58,237,.5)}
#aib i{font-style:normal;font-size:24px}#aib small{font-size:11px;font-weight:700}
#cb{position:absolute;top:calc(var(--safe-t) + 62px);left:62px;right:64px;display:flex;gap:2px;overflow-x:auto;background:#262a3a;border-radius:14px;padding:4px;z-index:5}
#cb button{display:flex;flex-direction:column;align-items:center;font-size:18px;padding:4px 9px;min-width:46px}
#cb button small{font-size:10px;font-weight:500;opacity:.85}
#cb .sp{width:1px;background:#4b5170;margin:4px 2px;flex:none}
#bd.hide .tb,#bd.hide .rl,#bd.hide #pb,#bd.hide #aib,#bd.hide #cb,#bd.pres .tb,#bd.pres .rl,#bd.pres #pb,#bd.pres #aib,#bd.pres #cb,#bd.pres #rb,#bd.pres #eye{display:none}
#pp{position:absolute;z-index:9;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;width:min(94%,380px);max-height:60vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#td{position:absolute;z-index:10;left:50%;top:calc(var(--safe-t) + 62px);transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;width:min(94%,400px);max-height:80vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#lo{position:absolute;inset:0;z-index:20;background:rgba(10,12,24,.82);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
#lo .card{width:100%;max-width:440px;margin:auto}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.lg button{background:var(--soft);color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;font-size:14px}
.lg button.on{outline:3px solid var(--pri)}
.lg i{display:block;border:3px solid var(--pri);border-radius:4px;background:var(--card)}
#aip{position:absolute;left:0;right:0;bottom:0;height:min(72%,580px);background:var(--card);color:var(--tx);border-radius:20px 20px 0 0;z-index:12;display:flex;flex-direction:column;padding:12px;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
#bd textarea,#bd input{-webkit-user-select:text;user-select:text}
#aip .ah{display:flex;align-items:center;margin-bottom:8px}#aip .ah b{flex:1}
#aim{flex:1;overflow:auto;margin-bottom:8px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
.sw i{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);display:inline-block}
.sw i.no{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#fca5a5 4px,#fca5a5 6px)}
.sw input[type=color]{width:38px;height:38px;padding:0;border:0;margin:0;background:none}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sg button{background:var(--soft);font-size:24px;padding:6px;color:var(--tx)}
.sg.s5{grid-template-columns:repeat(5,1fr)}
.fl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:min(190px,30vh);overflow:auto;margin-bottom:8px}
.fl button{background:var(--soft);color:var(--tx);font-size:17px;padding:6px 8px;text-align:center;line-height:1.3;font-weight:700}
.fl button span{font-size:12px;opacity:.7;font-weight:400}
.fl button.on{outline:2px solid var(--pri)}
.row button.on{outline:2px solid var(--pri)}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th div{position:relative;border:2px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--soft);padding:2px}
.th img{width:100%;display:block;border-radius:6px}
.th div.on{border-color:var(--pri)}
.th small{position:absolute;top:4px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
.th .act{display:flex;gap:2px;justify-content:center}
.th .act button{padding:2px 6px;font-size:13px;background:transparent;color:var(--tx)}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hub button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:18px;font-size:16px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hub button i{font-style:normal;font-size:38px}
.hub button small{font-weight:400;font-size:12px;opacity:.92}

#xm{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
#xm[hidden],#rsb[hidden]{display:none}#xm .card{width:100%;max-width:420px;margin:auto;max-height:92vh;overflow:auto}
#toast{z-index:60}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tg2{display:grid;gap:10px}
.tc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:right;cursor:pointer;color:var(--fg);min-height:120px}
.tc b{font-size:15px}.tc small,.tc span{font-size:12px;color:var(--mut)}.tc .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.tc .tag{position:absolute;top:8px;left:8px;font-size:10px;background:var(--soft);padding:2px 6px;border-radius:8px}.tc .nw{background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-right:6px}
.tt{border-collapse:collapse;width:100%;min-width:420px}.tt th,.tt td{border:1px solid var(--bd);padding:6px;text-align:center;font-size:13px;min-width:56px}.tt tr.td th{background:var(--pri);color:#fff}.tt td small{display:block;color:var(--mut)}
.rdt{white-space:pre-wrap;line-height:1.9;background:var(--card);border-radius:14px;padding:14px;user-select:text;-webkit-user-select:text}.rdt mark{border-radius:4px;padding:0 1px;color:#111}
#rsb{position:fixed;left:8px;right:8px;bottom:calc(var(--safe-b) + 70px);z-index:30;background:#262a3a;border-radius:16px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#rsb button{background:#3a3f55;color:#fff;padding:7px 10px;font-size:13px}#rsb i{width:24px;height:24px;border-radius:50%;display:inline-block;border:2px solid #fff}
.wdp{margin-bottom:10px}.wdp textarea{width:100%}
</style>
</head>
<body>
<div id="lock" hidden></div>
<div id="app" hidden>
<header><span id="lg"></span><b>Roqaya</b><button class="g s" onclick="lockNow()">🔒 قفل</button></header>
<main id="v"></main>
<nav id="nv"></nav>
</div>
<div id="bd" hidden>
<div id="st"><div id="bw"><canvas id="ov"></canvas><canvas id="hd"></canvas></div></div>
<button id="eye" onclick="tglUI()" title="إخفاء/إظهار الأدوات">👁</button>
<div class="tb"><button onclick="closeBd()">✕</button><b id="bt"></b><button onclick="undo()" title="تراجع">↶</button><button onclick="redo()" title="إعادة">↷</button><button onclick="clr2(this)" title="مسح الصفحة">🗑</button><button onclick="libSave()" title="حفظ في مكتبتي">📚</button><button id="gen" onclick="genDlg()" title="توليد بالذكاء الاصطناعي" hidden>✨</button><button id="prs" onclick="present()" title="عرض" hidden>▶️</button><button id="anb" onclick="animPlay()" title="معاينة الحركة">🎬</button><button id="rtb" onclick="rot()" title="أفقي/رأسي">⟳</button><button onclick="pop('bg')" title="الخلفية">🎨</button><button onclick="pop('exp')" title="حفظ ومشاركة">📤</button></div>
<div id="rl" class="rl"></div>
<div id="cb" hidden></div>
<div id="pb"></div>
<button id="rb" onclick="recToggle()"><i>⏺</i><small>تسجيل</small></button>
<button id="aib" onclick="aiOpen()"><i>🤖</i><small>اسألي</small></button>
<div id="pp" hidden></div><div id="td" hidden></div><div id="aip" hidden></div><div id="lo" hidden></div>
<input type="file" id="fi" accept="image/*" hidden onchange="addImg(this)">
</div>
<div id="md" hidden></div><div id="xm" hidden></div><div id="rsb" hidden><button onclick="rdSel('ex')">💡 اشرحي</button><button onclick="rdSel('simp')">✂️ بسّطي</button><button onclick="rdSel('q')">❓ أسئلة</button><button onclick="rdSel('nt')">🗒 ملاحظة</button><button onclick="rdSel('bd')">🧑‍🏫 للسبورة</button><button onclick="rdSel('#fde047')"><i style="background:#fde047"></i></button><button onclick="rdSel('#86efac')"><i style="background:#86efac"></i></button><button onclick="rdSel('#f9a8d4')"><i style="background:#f9a8d4"></i></button><button onclick="rdSel('#93c5fd')"><i style="background:#93c5fd"></i></button><button onclick="rdSel('un')">✖ شيلي</button></div>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const K='roqaya_v1';
let S={pw:null,salt:null,cred:null,students:[],att:{}};
try{const r=JSON.parse(localStorage.getItem(K));if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const logo=z=>`<img src="${IMG}" width="${z}" height="${z}" alt="Roqaya" style="border-radius:22%;object-fit:cover;display:block;margin:0 auto">`;const _l0=z=>`<svg width="${z}" height="${z}" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#7c3aed"/><text x="32" y="42" font-size="26" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial">ME</text></svg>`;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
async function hash(p,salt){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64=u=>btoa(String.fromCharCode(...u));
async function regBio(){const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Roqaya'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'teacher',displayName:'Roqaya'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});S.cred=b64(new Uint8Array(c.rawId));save()}
async function bioLogin(){try{const raw=Uint8Array.from(atob(S.cred),c=>c.charCodeAt(0));await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:raw}],userVerification:'required',timeout:60000}});enter()}catch(e){toast('البصمة مش متاحة دلوقتي، استخدمي كلمة المرور')}}
const hasBio=!!window.PublicKeyCredential;

/* ---------- القفل ---------- */
function showLock(){
  $('#app').hidden=true;const L=$('#lock');L.hidden=false;
  if(!S.pw){
    L.innerHTML=`<div class="card">${logo(72)}<h2>أهلاً في Roqaya</h2><p class="mut">اعملي كلمة مرور لحماية بيانات طلابك (4 حروف أو أكتر)</p>
    <input id="p1" type="password" placeholder="كلمة المرور" autocomplete="new-password"><input id="p2" type="password" placeholder="أكّدي كلمة المرور" autocomplete="new-password">
    ${hasBio?'<label class="mut" style="display:block;margin-bottom:10px"><input id="bio" type="checkbox" style="width:auto;margin-left:6px">تفعيل البصمة كمان</label>':''}
    <button style="width:100%" onclick="setup()">ابدأ</button></div>`;
  }else{
    L.innerHTML=`<div class="card">${logo(72)}<h2>Roqaya</h2>
    <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">
    <button style="width:100%" onclick="login()">دخول</button>
    ${S.cred?'<button class="g" style="width:100%;margin-top:8px" onclick="bioLogin()">👆 دخول بالبصمة</button>':''}
    <p><button class="g s" id="fg" onclick="forgot()">نسيت كلمة المرور؟</button></p><p class="mut" style="font-size:12px;margin:6px 0 0">تطوير وتنفيذ Mahmoud · ${DEVTEL}</p></div>`;
  }
}
async function setup(){
  const a=$('#p1').value,b=$('#p2').value;
  if(a.length<4)return toast('كلمة المرور قصيرة');
  if(a!==b)return toast('الكلمتين مش زي بعض');
  S.salt=b64(crypto.getRandomValues(new Uint8Array(12)));S.pw=await hash(a,S.salt);save();

  if(ext=='pptx'){const z=await unzip(await readBuf(f)),names=Object.keys(z).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)));for(const n of names){const d=new DOMParser().parseFromString(await ztxt(z,n),'application/xml');const L=[];for(const p of d.getElementsByTagNameNS('*','p')){const t=[...p.getElementsByTagNameNS('*','t')].map(e=>e.textContent).join('');if(t.trim())L.push(t)}r.pages.push({t:L.join('\n')})}return r}
  if(ext=='epub'){const z=await unzip(await readBuf(f)),cont=await ztxt(z,'META-INF/container.xml'),opfPath=(/full-path="([^"]+)"/.exec(cont)||[])[1];if(!opfPath)throw new Error('epub');const opf=new DOMParser().parseFromString(await ztxt(z,opfPath),'application/xml'),base=opfPath.includes('/')?opfPath.replace(/[^/]+$/,''):'',man={};for(const it of opf.getElementsByTagNameNS('*','item'))man[it.getAttribute('id')]=it.getAttribute('href');
    for(const ir of opf.getElementsByTagNameNS('*','itemref')){const h=man[ir.getAttribute('idref')];if(!h)continue;const x=await ztxt(z,decodeURIComponent(base+h));if(!x)continue;const d=new DOMParser().parseFromString(x,'text/html');d.querySelectorAll('script,style').forEach(e=>e.remove());const t=(d.body?d.body.innerText||d.body.textContent:'').replace(/\n\s*\n+/g,'\n').trim();if(t)splitPages(t,2200).forEach(x=>r.pages.push({t:x}))}return r}
  if(/^(png|jpe?g|webp|gif|bmp)$/.test(ext)||(f.type||'').startsWith('image/')){r.pages.push({t:'',img:await readUrl(f)});r.fmt='img';return r}
  let t=dec(new Uint8Array(await readBuf(f)));

async function whAI(){const t=($('#wht2').value||'').trim();if(!t)return toast('اكتبي موضوع الدرس');toast('بولّد الأسئلة…');
  try{const r=await aiCall('اكتبي 8 أسئلة قصيرة (أقل من 12 كلمة) للمراجعة عن: '+t+'. رجّعي JSON صالح فقط بالشكل {"q":["سؤال","سؤال"]} باللغة العربية.');const j=parseJ(r.text);if(!Array.isArray(j.q)||!j.q.length)throw 0;WHL.items=j.q.map(String).slice(0,12);whV()}catch(e){toast(e&&e.code?errMsg(e):'مقدرتش أولّد الأسئلة، جرّبي تاني')}}
/* ---------- بطاقات المراجعة ---------- */
const FCD={q:[],i:0,fl:0,deck:null,known:0};
const fcDecks=()=>S.cards||(S.cards=[]);
function fcStart(){fcV()}
function fcV(){const d=fcDecks();vw('🃏 بطاقات المراجعة',`<button style="width:100%;margin-bottom:10px" onclick="fcNew()">➕ مجموعة جديدة</button>${d.length?d.map((x,i)=>`<div class="card"><div class="row" style="align-items:center"><div style="flex:1"><b>${esc(x.name)}</b><div class="mut">${x.cards.length} بطاقة</div></div><button class="s" style="flex:none" onclick="fcStudy(${i})">▶ ذاكري</button><button class="g s" style="flex:none" onclick="fcNew(${i})">✎</button><button class="g s" style="flex:none;color:#ef4444" onclick="fcDel(${i})">🗑</button></div></div>`).join(''):'<div class="card mut">مفيش مجموعات لسه. اعملي مجموعة وكتبي فيها «سؤال | إجابة» أو خلّي الذكاء الاصطناعي يولّدها.</div>'}`)}
function fcNew(i){const d=i!=null?fcDecks()[i]:null;mdl(`<h3>🃏 ${d?'تعديل':'مجموعة جديدة'}</h3><input id="fcn" placeholder="اسم المجموعة" value="${esc(d?d.name:'')}"><textarea id="fct" style="min-height:150px" placeholder="كل سطر: السؤال | الإجابة">${esc(d?d.cards.map(c=>c.q+' | '+c.a).join('\n'):'')}</textarea><div class="row" style="margin-bottom:8px"><input id="fcai" placeholder="أو اكتبي موضوع الدرس" style="margin:0"><button class="s" style="flex:none" onclick="fcAI()">✨ ولّدي</button></div><div class="row"><button onclick="fcSave(${i==null?-1:i})">حفظ</button><button class="g" onclick="mdlX()">إلغاء</button></div>`)}
async function fcAI(){const t=($('#fcai').value||'').trim();if(!t)return toast('اكتبي موضوع الدرس');toast('بولّد البطاقات…');
  try{const r=await aiCall('اعملي 10 بطاقات مراجعة عن: '+t+'. رجّعي JSON صالح فقط بالشكل {"cards":[{"q":"سؤال قصير","a":"إجابة قصيرة"}]} باللغة العربية.');const j=parseJ(r.text);if(!Array.isArray(j.cards)||!j.cards.length)throw 0;const box=$('#fct');box.value=(box.value.trim()?box.value.trim()+'\n':'')+j.cards.map(c=>String(c.q).replace(/\|/g,'/')+' | '+String(c.a).replace(/\|/g,'/')).join('\n');if(!$('#fcn').value.trim())$('#fcn').value=t}catch(e){toast(e&&e.code?errMsg(e):'مقدرتش أولّد، جرّبي تاني')}}
function fcSave(i){const cards=$('#fct').value.split('\n').map(l=>l.split('|')).filter(p=>p[0].trim()&&(p[1]||'').trim()).map(p=>({q:p[0].trim(),a:p.slice(1).join('|').trim()}));if(!cards.length)return toast('اكتبي بطاقة واحدة على الأقل: سؤال | إجابة');const name=$('#fcn').value.trim()||'مجموعة';if(i>=0)Object.assign(fcDecks()[i],{name,cards});else fcDecks().push({id:Date.now().toString(36),name,cards});save();mdlX();fcV()}
function fcDel(i){if(!confirm('تمسحي المجموعة دي؟'))return;fcDecks().splice(i,1);save();fcV()}
function fcStudy(i){const d=fcDecks()[i];FCD.deck=d;FCD.q=shuf(d.cards);FCD.i=0;FCD.fl=0;FCD.known=0;fcS()}
function fcS(){const q=FCD.q,c=q[FCD.i];if(!c){vw('🎉 خلصتي المجموعة',`<div class="card" style="text-align:center"><div style="font-size:60px">🎉</div><p>عرفتي ${FCD.known} من ${FCD.deck.cards.length} بطاقة</p><button style="width:100%" onclick="fcStudy(${fcDecks().indexOf(FCD.deck)})">🔁 مرة تانية</button></div>`,'fcV()');return}
  vw('🃏 '+esc(FCD.deck.name),`<div class="mut" style="text-align:center;margin-bottom:6px">${FCD.i+1} / ${q.length}</div><div onclick="FCD.fl=!FCD.fl;fcS()" style="cursor:pointer;min-height:240px;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:26px;font-weight:700;color:#fff;background:${FCD.fl?'linear-gradient(135deg,#16a34a,#0d9488)':'linear-gradient(135deg,#f97316,#ef4444)'}">${esc(FCD.fl?c.a:c.q)}</div><p class="mut" style="text-align:center">${FCD.fl?'الإجابة':'السؤال'} · اضغطي على البطاقة عشان تقلبيها</p>
  <div class="row"><button class="g" onclick="fcNx(0)">🔁 لسه</button><button onclick="fcNx(1)">✅ عرفتها</button></div>`,'fcV()')}
function fcNx(k){const c=FCD.q[FCD.i];FCD.fl=0;if(k){FCD.known++;FCD.i++}else{FCD.q.splice(FCD.i,1);FCD.q.push(c);if(FCD.q.every(x=>x===c)){FCD.i=0}}fcS()}
/* ---------- محوّل الوحدات ---------- */
const UNI={len:['الطول',[['مم',.001],['سم',.01],['م',1],['كم',1000],['بوصة',.0254],['قدم',.3048],['ياردة',.9144],['ميل',1609.344]]],mass:['الكتلة',[['ملجم',1e-6],['جم',.001],['كجم',1],['طن',1000],['أونصة',.028349523],['رطل',.45359237]]],time:['الزمن',[['ثانية',1],['دقيقة',60],['ساعة',3600],['يوم',86400],['أسبوع',604800]]],area:['المساحة',[['سم²',1e-4],['م²',1],['كم²',1e6],['فدان',4200.83],['هكتار',1e4]]],vol:['الحجم',[['مل',.001],['لتر',1],['م³',1000],['جالون',3.785411784]]],spd:['السرعة',[['م/ث',1],['كم/س',1/3.6],['ميل/س',.44704],['عقدة',.514444]]],tmp:['الحرارة',[['°م'],['°ف'],['°ك']]]};
const UN={k:'len',a:0,b:1,v:1};
function unStart(){unV()}
function unCalc(){const [,L]=UNI[UN.k],v=+UN.v;if(UN.k=='tmp'){const toC=(x,i)=>i==0?x:i==1?(x-32)*5/9:x-273.15,fromC=(c,i)=>i==0?c:i==1?c*9/5+32:c+273.15;return i=>fromC(toC(v,UN.a),i)}return i=>v*L[UN.a][1]/L[i][1]}
const unF=x=>isFinite(x)?+x.toPrecision(10)+'':'—';
function unV(){const [,L]=UNI[UN.k],f=unCalc(),opt=s=>L.map((u,i)=>`<option value="${i}" ${s==i?'selected':''}>${u[0]}</option>`).join('');
  vw('🧮 محوّل الوحدات',`<div class="chips">${Object.keys(UNI).map(k=>`<button class="${UN.k==k?'on':'g'}" onclick="UN.k='${k}';UN.a=0;UN.b=1;unV()">${UNI[k][0]}</button>`).join('')}</div>
  <div class="card"><input type="number" inputmode="decimal" dir="ltr" value="${UN.v}" oninput="UN.v=this.value;unR()" style="font-size:24px"><div class="row" style="align-items:center"><select onchange="UN.a=+this.value;unR()">${opt(UN.a)}</select><span>←</span><select onchange="UN.b=+this.value;unR()">${opt(UN.b)}</select></div>
  <div id="unr" style="text-align:center;font-size:30px;font-weight:700;padding:12px;direction:ltr;color:var(--pri)">${unF(f(UN.b))} ${L[UN.b][0]}</div></div><div class="card" id="una"></div>`);unR()}
function unR(){const [,L]=UNI[UN.k],f=unCalc();$('#unr').textContent=unF(f(UN.b))+' '+L[UN.b][0];$('#una').innerHTML=L.map((u,i)=>`<div class="row" style="justify-content:space-between;padding:3px 0"><span>${u[0]}</span><b style="direction:ltr">${unF(f(i))}</b></div>`).join('')}
/* ---------- مؤقّت الحصة ---------- */
const LT={ph:[{n:'تمهيد',m:5},{n:'شرح الدرس',m:15},{n:'نشاط',m:15},{n:'تقويم',m:5},{n:'ختام',m:5}],i:0,left:0,run:0,iv:null};
function ltStart(){ltStop();ltV()}
function ltV(){const tot=LT.ph.reduce((a,p)=>a+(+p.m||0),0);vw('⏳ مؤقّت الحصة',`<div class="card"><b>مراحل الحصة</b> <span class="mut">(المجموع ${tot} دقيقة)</span>${LT.ph.map((p,i)=>`<div class="row" style="align-items:center;gap:6px;margin-top:6px"><input value="${esc(p.n)}" oninput="LT.ph[${i}].n=this.value" style="margin:0"><input type="number" inputmode="numeric" min="1" value="${p.m}" oninput="LT.ph[${i}].m=+this.value" style="margin:0;width:70px;flex:none"><span class="mut" style="flex:none">د</span><button class="g s" style="flex:none;color:#ef4444" onclick="LT.ph.splice(${i},1);ltV()">✕</button></div>`).join('')}<div class="row" style="margin-top:8px"><button class="g" onclick="LT.ph.push({n:'مرحلة',m:5});ltV()">➕ مرحلة</button><button class="g" onclick="LT.ph=[{n:'تمهيد',m:5},{n:'شرح الدرس',m:15},{n:'نشاط',m:15},{n:'تقويم',m:5},{n:'ختام',m:5}];ltV()">↺ الافتراضي</button></div></div><button style="width:100%;font-size:20px;padding:14px" onclick="ltRun()">▶ ابدئي الحصة</button>`)}
function ltStop(){clearInterval(LT.iv);LT.run=0;const e=$('#ltv');if(e)e.remove();try{LT.wl&&LT.wl.release()}catch(e){}}
function ltRun(){if(!LT.ph.length)return;LT.ph=LT.ph.filter(p=>+p.m>0);if(!LT.ph.length)return toast('اكتبي مدة لكل مرحلة');LT.i=0;LT.left=LT.ph[0].m*60;LT.run=1;try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>LT.wl=w).catch(()=>{})}catch(e){}
  let e=$('#ltv');if(!e){e=document.createElement('div');e.id='ltv';e.style.cssText='position:fixed;inset:0;z-index:48;background:linear-gradient(160deg,#1e1b4b,#4c1d95);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center';document.body.appendChild(e)}
  clearInterval(LT.iv);LT.iv=setInterval(()=>{if(!LT.run)return;LT.left--;if(LT.left<=0){beep();if(LT.i<LT.ph.length-1){LT.i++;LT.left=LT.ph[LT.i].m*60}else{LT.run=0;LT.left=0;clearInterval(LT.iv);ltDraw(1);return}}ltDraw()},1000);ltDraw()}
function ltDraw(done){const e=$('#ltv');if(!e)return;const p=LT.ph[LT.i],m=Math.floor(LT.left/60),s=LT.left%60,tot=LT.ph.reduce((a,x)=>a+x.m*60,0),past=LT.ph.slice(0,LT.i).reduce((a,x)=>a+x.m*60,0)+(p.m*60-LT.left),nx=LT.ph[LT.i+1];
  e.innerHTML=done?`<div style="font-size:80px">🎉</div><div style="font-size:34px;font-weight:700">انتهت الحصة</div><button style="font-size:20px" onclick="ltStop()">إغلاق</button>`:`<div style="font-size:26px;opacity:.8">${LT.i+1} / ${LT.ph.length}</div><div style="font-size:42px;font-weight:700">${esc(p.n)}</div><div style="font-size:min(30vw,150px);font-weight:700;direction:ltr;font-variant-numeric:tabular-nums;color:${LT.left<=60?'#fca5a5':'#fff'}">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div><div style="width:min(86vw,520px);height:10px;border-radius:6px;background:rgba(255,255,255,.2)"><div style="height:100%;border-radius:6px;background:#facc15;width:${Math.min(100,past/tot*100)}%"></div></div><div style="opacity:.8">${nx?'بعدها: '+esc(nx.n):'آخر مرحلة'}</div><div class="row" style="gap:10px"><button onclick="LT.run=!LT.run;ltDraw()" style="font-size:20px">${LT.run?'⏸ إيقاف':'▶ كمّلي'}</button><button class="g" onclick="LT.left=0" style="font-size:20px">⏭ التالية</button><button class="g" onclick="ltStop()" style="font-size:20px">✕</button></div>`}
/* ---------- متابعة الواجبات ---------- */
const HW={cur:null,g:''};
const hwL=()=>S.hw||(S.hw=[]);
function hwStart(){hwV()}
function hwV(){const L=hwL();vw('📋 متابعة الواجبات',`<div class="row" style="margin-bottom:10px"><input id="hwt" placeholder="عنوان الواجب (مثال: حل تمارين ص 20)" style="margin:0"><button style="flex:none" onclick="hwAdd()">➕</button></div>${S.students.length?'':'<div class="card mut">ضيفي طلابك الأول من تبويب «الطلاب».</div>'}${L.length?L.map((h,i)=>{const n=S.students.filter(s=>h.done[s.id]).length;return`<div class="card" onclick="hwOpen(${i})" style="cursor:pointer"><div class="row" style="align-items:center"><div style="flex:1"><b>${esc(h.title)}</b><div class="mut">${h.date} · سلّم ${n} من ${S.students.length}</div></div><button class="g s" style="flex:none;color:#ef4444" onclick="event.stopPropagation();hwDel(${i})">🗑</button></div></div>`}).reverse().join(''):'<div class="card mut">مفيش واجبات لسه.</div>'}`)}
function hwAdd(){const t=($('#hwt').value||'').trim();if(!t)return toast('اكتبي عنوان الواجب');hwL().push({id:Date.now().toString(36),title:t,date:new Date().toLocaleDateString('ar-EG'),done:{}});save();hwOpen(hwL().length-1)}
function hwDel(i){if(!confirm('تمسحي الواجب ده؟'))return;hwL().splice(i,1);save();hwV()}
function hwOpen(i){HW.cur=i;hwS()}
function hwS(){const h=hwL()[HW.cur];if(!h)return hwV();const L=S.students.filter(s=>!HW.g||s.group==HW.g),n=L.filter(s=>h.done[s.id]).length;
  vw('📋 '+esc(h.title),`<div class="chips"><button class="${HW.g?'g':'on'}" onclick="HW.g='';hwS()">الكل</button>${groups().map(g=>`<button class="${HW.g==g?'on':'g'}" onclick="HW.g='${esc(g).replace(/'/g,'')}';hwS()">${esc(g)}</button>`).join('')}</div><div class="card" style="text-align:center"><b style="font-size:26px;color:var(--ok)">${n}</b> سلّموا · <b style="font-size:26px;color:var(--no)">${L.length-n}</b> لسه</div>
  <div class="row" style="margin-bottom:8px"><button class="g" onclick="hwAll(1)">الكل سلّم</button><button class="g" onclick="hwAll(0)">مسح الكل</button><button class="s" onclick="hwCopy()">📋 نسخ اللي ما سلّموش</button></div>
  <div class="tg">${L.map(s=>`<div class="tc" style="min-height:0;align-items:center;justify-content:center;text-align:center;padding:12px 6px;background:${h.done[s.id]?'#16a34a':'var(--card)'};color:${h.done[s.id]?'#fff':'var(--fg)'}" onclick="hwTg('${s.id}')"><b style="font-size:14px">${h.done[s.id]?'✅ ':''}${esc(s.name)}</b></div>`).join('')}</div>`,'hwV()')}
function hwTg(id){const h=hwL()[HW.cur];h.done[id]=!h.done[id];save();hwS()}
function hwAll(v){const h=hwL()[HW.cur];S.students.filter(s=>!HW.g||s.group==HW.g).forEach(s=>{h.done[s.id]=!!v});save();hwS()}
function hwCopy(){const h=hwL()[HW.cur],t='لم يسلّموا «'+h.title+'»:\n'+S.students.filter(s=>(!HW.g||s.group==HW.g)&&!h.done[s.id]).map(s=>'- '+s.name).join('\n');try{navigator.clipboard.writeText(t);toast('اتنسخت ✓')}catch(e){mdl(`<h3>الأسماء</h3><textarea style="min-height:150px">${esc(t)}</textarea><button class="g" style="width:100%" onclick="mdlX()">إغلاق</button>`)}}
/* ---------- قرعة المجموعات ---------- */
const GP={n:4,g:'',manual:'',res:null};
function gpStart(){GP.res=null;gpV()}
function gpV(){vw('✨ قرعة المجموعات',`${S.students.length?`<div class="chips"><button class="${GP.g?'g':'on'}" onclick="GP.g='';gpV()">كل الطلاب (${S.students.length})</button>${groups().map(g=>`<button class="${GP.g==g?'on':'g'}" onclick="GP.g='${esc(g).replace(/'/g,'')}';gpV()">${esc(g)}</button>`).join('')}</div>`:'<p class="mut">مفيش طلاب مسجّلين، اكتبي الأسماء هنا (اسم في كل سطر):</p><textarea id="gpm" style="min-height:110px" oninput="GP.manual=this.value">'+esc(GP.manual)+'</textarea>'}
  <p class="mut" style="margin:4px 0">عدد المجموعات</p><div class="chips">${[2,3,4,5,6,7,8].map(n=>`<button class="${GP.n==n?'on':'g'}" onclick="GP.n=${n};gpV()">${n}</button>`).join('')}</div><button style="width:100%;margin-bottom:10px" onclick="gpGo()">🎲 اعملي القرعة</button><div id="gpr">${GP.res?gpHtml():''}</div>`)}
function gpNames(){return S.students.length?S.students.filter(s=>!GP.g||s.group==GP.g).map(s=>s.name):GP.manual.split('\n').map(x=>x.trim()).filter(Boolean)}
function gpGo(){const L=shuf(gpNames());if(L.length<2)return toast('محتاجة اسمين على الأقل');const n=Math.min(GP.n,L.length);GP.res=Array.from({length:n},()=>[]);L.forEach((x,i)=>GP.res[i%n].push(x));gpV()}
const GPC=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
function gpHtml(){return `<div class="row" style="margin-bottom:8px"><button class="g" onclick="gpGo()">🔁 قرعة تانية</button><button class="g" onclick="gpCopy()">📋 نسخ</button><button class="s" onclick="gpBoard()">📌 للسبورة</button></div><div class="tg">${GP.res.map((g,i)=>`<div class="card" style="border-top:6px solid ${GPC[i%8]};margin:0"><b>المجموعة ${i+1}</b>${g.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`).join('')}</div>`}
function gpCopy(){const t=GP.res.map((g,i)=>'المجموعة '+(i+1)+':\n'+g.map(x=>'- '+x).join('\n')).join('\n\n');try{navigator.clipboard.writeText(t);toast('اتنسخت ✓')}catch(e){mdl(`<textarea style="min-height:200px">${esc(t)}</textarea><button class="g" style="width:100%" onclick="mdlX()">إغلاق</button>`)}}
function gpBoard(){const W=1280,H=720,p=mk(W,H,'#0f172a'),n=GP.res.length,cols=n<=4?n:Math.ceil(n/2),rows=n<=4?1:2,cw=(W-80)/cols,ch=(H-150)/rows;p.objs.push(mkT('🎲 المجموعات',W/2,60,60,'#ffffff'));
  GP.res.forEach((g,i)=>{const c=i%cols,r=Math.floor(i/cols),x=40+cw*(cols-1-c),y=130+ch*r,sz=Math.max(24,Math.min(48,ch/(Math.max(...GP.res.map(a=>a.length))+2)*1.1));p.objs.push(mkS('rect',x+8,y,cw-16,ch-14,{fill:GPC[i%8]+'33',col:GPC[i%8],sw:4}),mkT('المجموعة '+(i+1),x+cw/2,y+30,sz*1.2,GPC[i%8]),mkT(g.join('\n'),x+cw/2,y+30+sz*1.2+(g.length*sz*1.4)/2+10,sz,'#ffffff'))});placeDoc('wb',[p])}


function unlockAll(){P().objs.forEach(o=>{delete o.lk});pop();render();toast('اتفك التثبيت')}
function coverAdd(){const p=P();addObj(mkS('rect',p.w*.2,p.h*.2,p.w*.4,p.h*.08,{fill:'#ffffff',col:'#ffffff'}));pop()}
</script>
