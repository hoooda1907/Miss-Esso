<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miss Esoo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<script src="config.js"></script>
<link rel="apple-touch-icon" id="ati">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@700&family=Tajawal:wght@700&family=Reem+Kufi:wght@700&family=Aref+Ruqaa:wght@700&family=Lalezar&family=Changa:wght@700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c3aed'/%3E%3Ctext x='32' y='42' font-size='26' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EME%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1f1b2e;--mut:#6b6580;--pri:#7c3aed;--prit:#fff;--bd:#e4dff0;--ok:#16a34a;--no:#dc2626;--lt:#d97706;--soft:#efe9fd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121f;--card:#201b30;--tx:#f1eefb;--mut:#a9a2c0;--pri:#a78bfa;--prit:#1a1030;--bd:#352e4d;--soft:#2c2447;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15121f;--card:#201b30;--tx:#f1eefb;--mut:#a9a2c0;--pri:#a78bfa;--prit:#1a1030;--bd:#352e4d;--soft:#2c2447;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}
header b{font-size:19px;flex:1}
main{padding:0 14px 96px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:17px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
textarea{min-height:100px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pri);color:var(--prit);font-weight:600}
button.g{background:var(--soft);color:var(--pri)}
button.d{background:transparent;color:var(--no);border:1px solid var(--no)}
button.s{padding:6px 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--pri)}
.stat span{font-size:13px;color:var(--mut)}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .n{flex:1;min-width:0}
.it small{color:var(--mut);display:block}
.mk{display:flex;gap:6px}
.mk button{padding:7px 11px;background:var(--soft);color:var(--mut)}
.mk .p.on{background:var(--ok);color:#fff}.mk .a.on{background:var(--no);color:#fff}.mk .l.on{background:var(--lt);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:9px 2px;font-size:12px;font-weight:500}
nav button.on{color:var(--pri);font-weight:700}
nav button i{display:block;font-style:normal;font-size:21px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--soft);color:var(--mut);padding:7px 12px;font-size:14px}
.chips button.on{background:var(--pri);color:var(--prit)}
.msg{padding:10px 12px;border-radius:14px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.msg.u{background:var(--soft)}
.msg.b{background:var(--card);border:1px solid var(--bd)}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .card{width:100%;max-width:380px;text-align:center}
.mut{color:var(--mut);font-size:14px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:20;max-width:90%}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:flex;align-items:center;justify-content:center;padding:18px}

#md{z-index:40}#toast{z-index:50}
#bd{position:fixed;inset:0;z-index:30;background:var(--bg)}
#st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 64px) 64px calc(env(safe-area-inset-bottom,0px) + 72px) 6px}
#bw{position:relative;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.35);overflow:hidden}
#bw canvas{position:absolute;inset:0;width:100%;height:100%}
#ov{touch-action:none}
.tb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:2px;align-items:center;background:#262a3a;border-radius:16px;padding:5px 8px;color:#fff;overflow-x:auto}
.tb button,.bb button,.rl button{background:none;color:#fff;padding:6px 8px;font-size:19px;border-radius:10px;flex:none}
.tb b{flex:1;min-width:64px;font-size:15px;white-space:nowrap}
button.rec{background:#dc2626!important;font-size:14px!important}
.rl{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;background:#262a3a;border-radius:18px;padding:5px;gap:2px}
.rl button.on{background:#1f6f66}
.dot{display:block;width:22px;height:22px;border-radius:50%;border:2px solid #fff}
.bb{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:#262a3a;border-radius:18px;padding:5px 8px;color:#fff}
.bb span{background:#1f6f66;border-radius:10px;padding:4px 12px;font-weight:700}
#pp{position:absolute;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;width:min(92%,340px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
#td{position:absolute;z-index:4;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;width:min(92%,360px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.sw i{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);display:inline-block}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sg button{background:var(--soft);font-size:24px;padding:6px}
#sb{position:absolute;border:2px dashed #38bdf8;background:rgba(56,189,248,.1);pointer-events:none;z-index:2}
</style>
</head>
<body>
<div id="lock" hidden></div>
<div id="app" hidden>
<header><span id="lg"></span><b>Miss Esoo</b><button class="g s" onclick="lockNow()">🔒 قفل</button></header>
<main id="v"></main>
<nav id="nv"></nav>
</div>
<div id="bd" hidden>
<div id="st"><div id="bw"><canvas id="ov"></canvas><div id="sb" hidden></div></div></div>
<div class="tb"><button onclick="closeBd()">✕</button><b id="bt"></b><button onclick="undo()">↶</button><button onclick="clr2(this)">🗑</button><button onclick="rot()">⟳</button><button onclick="pop('bg')">🎨</button><button onclick="shareB()">📤</button><button onclick="saveB()">💾</button><button id="rb" onclick="recToggle()">⏺</button></div>
<div id="rl" class="rl"></div>
<div class="bb"><button onclick="pop('stk')">😀</button><button onclick="newPg()">＋</button><button onclick="pop('pg')">▦</button><span id="bn">1</span></div>
<div id="pp" hidden></div><div id="td" hidden></div>
<input type="file" id="fi" accept="image/*" hidden onchange="addImg(this)">
</div>
<div id="md" hidden></div>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const K='missesoo_v1';
let S={pw:null,salt:null,cred:null,students:[],att:{}};
try{const r=JSON.parse(localStorage.getItem(K));if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const logo=z=>`<img src="${IMG}" width="${z}" height="${z}" alt="Miss Esoo" style="border-radius:22%;object-fit:cover;display:block;margin:0 auto">`;const _l0=z=>`<svg width="${z}" height="${z}" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#7c3aed"/><text x="32" y="42" font-size="26" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial">ME</text></svg>`;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
async function hash(p,salt){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64=u=>btoa(String.fromCharCode(...u));
async function regBio(){const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Miss Esoo'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'teacher',displayName:'Miss Esoo'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});S.cred=b64(new Uint8Array(c.rawId));save()}
async function bioLogin(){try{const raw=Uint8Array.from(atob(S.cred),c=>c.charCodeAt(0));await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:raw}],userVerification:'required',timeout:60000}});enter()}catch(e){toast('البصمة مش متاحة دلوقتي، استخدمي كلمة المرور')}}
const hasBio=!!window.PublicKeyCredential;

/* ---------- القفل ---------- */
function showLock(){
  $('#app').hidden=true;const L=$('#lock');L.hidden=false;
  if(!S.pw){
    L.innerHTML=`<div class="card">${logo(72)}<h2>أهلاً في Miss Esoo</h2><p class="mut">اعملي كلمة مرور لحماية بيانات طلابك (4 حروف أو أكتر)</p>
    <input id="p1" type="password" placeholder="كلمة المرور" autocomplete="new-password"><input id="p2" type="password" placeholder="أكّدي كلمة المرور" autocomplete="new-password">
    ${hasBio?'<label class="mut" style="display:block;margin-bottom:10px"><input id="bio" type="checkbox" style="width:auto;margin-left:6px">تفعيل البصمة كمان</label>':''}
    <button style="width:100%" onclick="setup()">ابدأ</button></div>`;
  }else{
    L.innerHTML=`<div class="card">${logo(72)}<h2>Miss Esoo</h2>
    <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">
    <button style="width:100%" onclick="login()">دخول</button>
    ${S.cred?'<button class="g" style="width:100%;margin-top:8px" onclick="bioLogin()">👆 دخول بالبصمة</button>':''}
    <p><button class="d s" id="fg" onclick="forgot()">نسيت كلمة المرور؟</button></p></div>`;
  }
}
async function setup(){
  const a=$('#p1').value,b=$('#p2').value;
  if(a.length<4)return toast('كلمة المرور قصيرة');
  if(a!==b)return toast('الكلمتين مش زي بعض');
  S.salt=b64(crypto.getRandomValues(new Uint8Array(12)));S.pw=await hash(a,S.salt);save();
  if($('#bio')&&$('#bio').checked){try{await regBio()}catch(e){toast('البصمة مش متاحة هنا، هتدخلي بكلمة المرور')}}
  enter();
}
async function login(){if(await hash($('#pw').value,S.salt)===S.pw)enter();else toast('كلمة المرور غلط')}
function forgot(){const b=$('#fg');if(b.dataset.c){S={pw:null,salt:null,cred:null,students:[],att:{}};save();showLock()}else{b.dataset.c=1;b.textContent='هيتمسح كل شيء! اضغطي تاني للتأكيد'}}
function lockNow(){closeBd(1);hist=[];msgs=[];showLock()}
function enter(){$('#lock').hidden=true;$('#app').hidden=false;$('#lg').innerHTML=logo(34);go('home')}

/* ---------- التنقل ---------- */
let tab='home',ad=today(),ag='',mode='qa',busy=false,msgs=[],hist=[];
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const TABS=[['home','🏠','الرئيسية'],['stu','👩‍🎓','الطلاب'],['att','✅','الحضور'],['bd','🧑‍🏫','السبورة'],['ai','✨','الذكاء'],['set','⚙️','الإعدادات']];
function go(t){tab=t;$('#nv').innerHTML=TABS.map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');({bd:()=>{$('#v').innerHTML='';openBd()},home:vHome,stu:vStu,att:vAtt,ai:vAi,set:vSet})[t]();scrollTo(0,0)}
function st(id){let p=0,a=0,l=0;for(const d in S.att){const v=S.att[d][id];if(v=='p')p++;else if(v=='a')a++;else if(v=='l')l++}const t=p+a+l;return{p,a,l,t,pc:t?Math.round((p+l)/t*100):null}}
const groups=()=>[...new Set(S.students.map(s=>s.group).filter(Boolean))];

/* ---------- الرئيسية ---------- */
function vHome(){
  const td=S.att[today()]||{};let p=0,a=0,l=0;for(const k in td){if(td[k]=='p')p++;else if(td[k]=='a')a++;else l++}
  const abs=S.students.filter(s=>td[s.id]=='a');
  let tp=0,tt=0;S.students.forEach(s=>{const k=st(s.id);tp+=k.p+k.l;tt+=k.t});
  $('#v').innerHTML=`<div class="card"><h3>النهاردة ${today()}</h3><div class="grid">
  <div class="stat"><b>${S.students.length}</b><span>عدد الطلاب</span></div>
  <div class="stat"><b>${tt?Math.round(tp/tt*100)+'%':'—'}</b><span>نسبة الحضور العامة</span></div>
  <div class="stat"><b>${p}</b><span>حاضرين</span></div>
  <div class="stat"><b>${a}</b><span>غايبين</span></div></div></div>
  <div class="card"><h3>غايبين النهاردة</h3>${abs.length?abs.map(s=>`<div class="it"><div class="n">${esc(s.name)}<small>${esc(s.group)}</small></div><button class="g s" onclick="rep('${s.id}')">رسالة لولي الأمر</button></div>`).join(''):'<p class="mut">مفيش غياب مسجّل النهاردة.</p>'}</div>
  <div class="row"><button onclick="go('att')">سجّلي الحضور</button><button class="g" onclick="go('ai')">اسألي الذكاء</button></div>`;
}

/* ---------- الطلاب ---------- */
function vStu(){
  $('#v').innerHTML=`<div class="card"><h3>إضافة طالب</h3><input id="sn" placeholder="اسم الطالب"><div class="row"><input id="sg" placeholder="المجموعة / الفصل" list="gl"><input id="sp" placeholder="رقم ولي الأمر" inputmode="tel"></div><datalist id="gl">${groups().map(g=>`<option value="${esc(g)}">`).join('')}</datalist><button style="width:100%" onclick="addS()">إضافة</button></div>
  <div class="card"><input id="sq" placeholder="🔎 بحث" oninput="sl()"><div id="sl"></div></div>`;sl();
}
function addS(){const n=$('#sn').value.trim();if(!n)return toast('اكتبي اسم الطالب');S.students.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,group:$('#sg').value.trim(),phone:$('#sp').value.trim()});save();vStu();toast('تمت الإضافة')}
function sl(){const q=($('#sq')||{value:''}).value.trim();const L=S.students.filter(s=>!q||s.name.includes(q)||s.group.includes(q));
  $('#sl').innerHTML=L.length?L.map(s=>{const k=st(s.id);return`<div class="it"><div class="n"><b>${esc(s.name)}</b><small>${esc(s.group)} ${s.phone?'· '+esc(s.phone):''} · حضور ${k.pc==null?'—':k.pc+'%'} · غياب ${k.a}</small></div><button class="g s" onclick="rep('${s.id}')">✨</button><button class="d s" onclick="delS('${s.id}',this)">🗑</button></div>`}).join(''):'<p class="mut">لسه مفيش طلاب.</p>'}
function delS(id,b){if(b.dataset.c){S.students=S.students.filter(s=>s.id!=id);for(const d in S.att)delete S.att[d][id];save();sl()}else{b.dataset.c=1;b.textContent='تأكيد؟'}}

/* ---------- الحضور ---------- */
function vAtt(){
  $('#v').innerHTML=`<div class="card"><div class="row"><input type="date" id="ad" value="${ad}" onchange="ad=this.value;al()"><select id="ag" onchange="ag=this.value;al()"><option value="">كل المجموعات</option>${groups().map(g=>`<option ${g==ag?'selected':''} value="${esc(g)}">${esc(g)}</option>`).join('')}</select></div>
  <div class="row"><button class="g s" onclick="allP()">الكل حاضر</button><button class="g s" onclick="clrA()">مسح اليوم</button></div></div>
  <div class="card"><div id="as" class="mut" style="margin-bottom:6px"></div><div id="al"></div></div>`;al();
}
function al(){const L=S.students.filter(s=>!ag||s.group==ag),r=S.att[ad]||{};let p=0,a=0,l=0;L.forEach(s=>{if(r[s.id]=='p')p++;else if(r[s.id]=='a')a++;else if(r[s.id]=='l')l++});
  $('#as').textContent=`حاضر ${p} · غايب ${a} · متأخر ${l} · من ${L.length}`;
  $('#al').innerHTML=L.length?L.map(s=>`<div class="it"><div class="n">${esc(s.name)}<small>${esc(s.group)}</small></div><div class="mk">${[['p','ح'],['a','غ'],['l','ت']].map(m=>`<button class="${m[0]} ${r[s.id]==m[0]?'on':''}" onclick="mark('${s.id}','${m[0]}')">${m[1]}</button>`).join('')}</div></div>`).join(''):'<p class="mut">ضيفي طلاب الأول من تبويب الطلاب.</p>'}
function mark(id,v){S.att[ad]=S.att[ad]||{};if(S.att[ad][id]==v)delete S.att[ad][id];else S.att[ad][id]=v;save();al()}
function allP(){S.att[ad]=S.att[ad]||{};S.students.filter(s=>!ag||s.group==ag).forEach(s=>S.att[ad][s.id]='p');save();al()}
function clrA(){delete S.att[ad];save();al()}

/* ---------- الذكاء الاصطناعي ---------- */
const SYS='أنت Miss Esoo، مساعدة ذكية لمعلمة. رُدّي بالعربية بلهجة مصرية مبسطة ومنظمة. ';
const MODES={qa:['سؤال وجواب','جاوبي عن السؤال بوضوح وبالخطوات لو لازم.','اكتبي سؤالك هنا…'],sum:['تلخيص','لخّصي النص التالي في نقاط مرتبة مع أهم المفاهيم.','الصقي النص اللي عايزة تلخصيه…'],quiz:['أسئلة','اعملي 8 أسئلة متنوعة (اختيار من متعدد وصح/غلط) من المحتوى التالي، والإجابات النموذجية في الآخر.','الصقي الدرس أو اكتبي اسمه…'],exp:['شرح مبسط','اشرحي الموضوع التالي ببساطة لطالب ضعيف مع مثال من الحياة.','اكتبي الموضوع…']};
function vAi(){
  $('#v').innerHTML=`<div class="chips">${Object.keys(MODES).map(k=>`<button class="${k==mode?'on':''}" onclick="mode='${k}';vAi()">${MODES[k][0]}</button>`).join('')}</div>
  <div id="ms">${msgs.map(m=>`<div class="msg ${m.r}">${rich(m.t)}</div>`).join('')}</div>
  <div class="card"><textarea id="ai" placeholder="${MODES[mode][2]}"></textarea><div class="row"><button onclick="ask()" id="ab">إرسال ✨</button><button class="g" onclick="msgs=[];hist=[];vAi()">محادثة جديدة</button></div></div>`;
}
async function ask(){
  const t=$('#ai').value.trim();if(!t||busy)return;
  busy=true;$('#ab').textContent='بفكر…';
  msgs.push({r:'u',t});hist.push({role:'user',content:SYS+MODES[mode][1]+'\n\n'+t});
  msgs.push({r:'b',t:'…'});const i=msgs.length-1;$('#ai').value='';
  const draw=()=>{$('#ms').innerHTML=msgs.map(m=>`<div class="msg ${m.r}">${rich(m.t)}</div>`).join('')};draw();
  try{const r=await aiCall(hist.slice(-5),{onText:x=>{msgs[i].t=x.text;draw()}});msgs[i].t=r.text;hist.push({role:'assistant',content:r.text})}
  catch(e){msgs[i].t=errMsg(e);hist.pop()}
  busy=false;draw();const b=$('#ab');if(b)b.textContent='إرسال ✨';
}
async function rep(id){
  const s=S.students.find(x=>x.id==id),k=st(id);
  const md=$('#md');md.hidden=false;md.innerHTML='<div class="card" style="width:100%;max-width:420px"><p class="mut">بكتب الرسالة…</p></div>';
  let txt='';
  try{const r=await aiCall(SYS+'اكتبي رسالة قصيرة ومهذبة لولي أمر الطالب '+s.name+' عن حضوره: حضور '+k.p+'، غياب '+k.a+'، تأخير '+k.l+'، نسبة الحضور '+(k.pc==null?'غير متاحة':k.pc+'%')+'. وقّعيها باسم Miss Esoo. الرسالة فقط بدون شرح.',{cache:false});txt=r.text}catch(e){txt=errMsg(e)}
  md.innerHTML=`<div class="card" style="width:100%;max-width:420px"><div class="msg b">${esc(txt)}</div><div class="row"><button onclick="try{navigator.clipboard.writeText(decodeURIComponent('${encodeURIComponent(txt)}'));toast('اتنسخت')}catch(e){toast('انسخيها يدوي')}">نسخ</button><button class="g" onclick="$('#md').hidden=true">إغلاق</button></div></div>`;
}

const COL=['#ffffff','#111827','#ef4444','#f59e0b','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899'];

const B={pg:[],i:0,tool:'pen',col:'#ffffff',sz:4,shape:'line',font:'Amiri',stk:'⭐',ts:26};

const mk=(w,h,bg)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return{w,h,bg,c,u:[]}};
function openBd(){$('#bd').hidden=false;if(!B.pg.length)B.pg.push(mk(1280,720,BGS[0]));rail();show()}
function closeBd(x){commit();if(mr&&mr.state=='recording')mr.stop();$('#bd').hidden=true;if(!x)go('home')}
function show(){sel=null;sbox();const p=P(),w=$('#bw');w.querySelectorAll('canvas.pc').forEach(c=>c.remove());p.c.className='pc';w.insertBefore(p.c,ov);ov.width=p.w;ov.height=p.h;w.style.background=p.bg;$('#bn').textContent=B.i+1;$('#bt').textContent='سبورة '+(B.i+1);fit()}
function fit(){const p=P(),s=$('#st'),c=getComputedStyle(s),aw=s.clientWidth-parseFloat(c.paddingLeft)-parseFloat(c.paddingRight),ah=s.clientHeight-parseFloat(c.paddingTop)-parseFloat(c.paddingBottom),k=Math.min(aw/p.w,ah/p.h),w=$('#bw');w.style.width=p.w*k+'px';w.style.height=p.h*k+'px'}
function rail(){$('#rl').innerHTML=TL.map(t=>`<button class="${B.tool==t[0]?'on':''}" onclick="tool('${t[0]}')">${t[1]}</button>`).join('')+`<button onclick="pop('col')"><span class="dot" style="background:${B.col}"></span></button>`}
function tool(t){if(t=='im'){$('#fi').click();return}if(t!='mv')commit();B.tool=t;rail();if(t=='sh')pop('sh');else pop()}
function pop(k){const e=$('#pp');if(!k){e.hidden=true;return}e.hidden=false;let h='';
  if(k=='col')h=`<div class="sw">${COL.map(c=>`<i style="background:${c}" onclick="B.col='${c}';rail()"></i>`).join('')}</div><label class="mut">السُمك <input type="range" min="1" max="20" value="${B.sz}" oninput="B.sz=+this.value"></label>`;
  else if(k=='sh')h=`<div class="row">${[['line','➖'],['arrow','➡️'],['rect','▭'],['circle','◯']].map(s=>`<button class="g" onclick="B.shape='${s[0]}';pop()">${s[1]}</button>`).join('')}</div>`;
  else if(k=='stk')h=`<div class="sg">${STK.map(s=>`<button onclick="B.stk='${s}';B.tool='st';rail();pop()">${s}</button>`).join('')}</div>`;
  else if(k=='sel')h=`<div class="row"><button class="g" onclick="selScale(1.15)">➕</button><button class="g" onclick="selScale(.87)">➖</button><button class="d" onclick="selDel()">🗑</button><button onclick="commit()">✔</button></div><p class="mut" style="margin:8px 0 0">اسحبي المحدد لتحريكه، واضغطي ✔ للتثبيت</p>`;
  else if(k=='bg')h=`<div class="sw">${BGS.map(c=>`<i style="background:${c}" onclick="setBg('${c}')"></i>`).join('')}</div><p class="mut" style="margin:0">لون السبورة. أفقي/رأسي من زر ⟳</p>`;
  else h=`<div class="row" style="flex-wrap:wrap">${B.pg.map((p,j)=>`<button class="g" onclick="goPg(${j})">${j+1}</button>`).join('')}</div>`;

function setBg(c){P().bg=c;if(LIGHT.includes(c)&&B.col=='#ffffff')B.col='#111827';else if(!LIGHT.includes(c)&&B.col=='#111827')B.col='#ffffff';$('#bw').style.background=c;rail()}
let sel=null;
const kk=()=>$('#bw').clientWidth/P().w;
function sbox(x,y,w,h){const b=$('#sb');if(w==null){b.hidden=true;return}const k=kk();b.hidden=false;b.style.left=x*k+'px';b.style.top=y*k+'px';b.style.width=w*k+'px';b.style.height=h*k+'px'}

function commit(){if(!sel)return;const c=CX();c.globalCompositeOperation='source-over';c.drawImage(sel.c,sel.x,sel.y,sel.w,sel.h);sel=null;clr();sbox();pop()}
function lift(x,y,w,h){const p=P();x=Math.max(0,x);y=Math.max(0,y);w=Math.min(w,p.w-x);h=Math.min(h,p.h-y);if(w<12||h<12){sbox();return}snap();const t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').drawImage(p.c,x,y,w,h,0,0,w,h);CX().clearRect(x,y,w,h);sel={x,y,w,h,c:t};selDraw();pop('sel')}
function selScale(f){if(!sel)return;const cx=sel.x+sel.w/2,cy=sel.y+sel.h/2;sel.w*=f;sel.h*=f;sel.x=cx-sel.w/2;sel.y=cy-sel.h/2;selDraw()}

function goPg(j){commit();B.i=j;show();pop()}

function snap(){const p=P();try{p.u.push(CX().getImageData(0,0,p.w,p.h));if(p.u.length>15)p.u.shift()}catch(e){}}
function undo(){commit();const s=P().u.pop();if(s)CX().putImageData(s,0,0)}
function clr2(b){if(b.dataset.c){snap();CX().clearRect(0,0,P().w,P().h);b.dataset.c='';b.textContent='🗑'}else{b.dataset.c=1;b.textContent='؟';setTimeout(()=>{b.dataset.c='';b.textContent='🗑'},2500)}}
const clr=()=>ov.getContext('2d').clearRect(0,0,ov.width,ov.height);
const pt=e=>{const r=ov.getBoundingClientRect();return[(e.clientX-r.left)*ov.width/r.width,(e.clientY-r.top)*ov.height/r.height]};
function setSt(c,er){c.lineCap=c.lineJoin='round';c.globalCompositeOperation=er?'destination-out':'source-over';c.strokeStyle=er?'#000':B.col;c.lineWidth=B.sz*U()*(er?4:1)}
function strokePts(c,a,col,w){c.beginPath();c.moveTo(a[0][0],a[0][1]);a.forEach(q=>c.lineTo(q[0],q[1]));c.strokeStyle=col;c.lineWidth=w;c.lineCap=c.lineJoin='round';c.stroke()}
function shape(c,x0,y0,x1,y1){c.strokeStyle=B.col;c.lineWidth=B.sz*U();c.lineCap=c.lineJoin='round';c.beginPath();const s=B.shape;
  if(s=='rect')c.rect(x0,y0,x1-x0,y1-y0);else if(s=='circle')c.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,7);
  else{c.moveTo(x0,y0);c.lineTo(x1,y1);if(s=='arrow'){const a=Math.atan2(y1-y0,x1-x0),h=14*U();c.moveTo(x1,y1);c.lineTo(x1-h*Math.cos(a-.5),y1-h*Math.sin(a-.5));c.moveTo(x1,y1);c.lineTo(x1-h*Math.cos(a+.5),y1-h*Math.sin(a+.5))}}
  c.stroke()}
function pd(e){e.preventDefault();pop();try{ov.setPointerCapture(e.pointerId)}catch(x){}const[x,y]=pt(e),t=B.tool,c=CX();dr={x0:x,y0:y,pts:[[x,y]],moved:0};
  if(t=='mv'){const h=sel&&x>=sel.x&&x<=sel.x+sel.w&&y>=sel.y&&y<=sel.y+sel.h;if(sel&&!h)commit();dr.mv=h?{dx:x-sel.x,dy:y-sel.y}:null;dr.rect=!h;return}
  if(t=='pen'||t=='er'){snap();setSt(c,t=='er');c.beginPath();c.moveTo(x,y);c.lineTo(x+.01,y);c.stroke()}}
function pm(e){if(!dr)return;const[x,y]=pt(e),t=B.tool,c=CX(),l=dr.pts[dr.pts.length-1],o=ov.getContext('2d');
  if(Math.hypot(x-dr.x0,y-dr.y0)>6)dr.moved=1;dr.pts.push([x,y]);
  if(t=='mv'){if(dr.mv&&sel){sel.x=x-dr.mv.dx;sel.y=y-dr.mv.dy;selDraw()}else if(dr.rect)sbox(Math.min(dr.x0,x),Math.min(dr.y0,y),Math.abs(x-dr.x0),Math.abs(y-dr.y0))}
  else if(t=='pen'||t=='er'){c.beginPath();c.moveTo(l[0],l[1]);c.lineTo(x,y);c.stroke()}
  else if(t=='hl'){clr();o.save();o.globalAlpha=.4;strokePts(o,dr.pts,B.col,B.sz*U()*3);o.restore()}
  else if(t=='sh'){clr();shape(o,dr.x0,dr.y0,x,y)}
  else if(t=='ls'){clr();dr.pts.slice(-18).forEach((q,i,a)=>{o.globalAlpha=(i+1)/a.length;o.fillStyle='#ef4444';o.beginPath();o.arc(q[0],q[1],(4+i*.4)*U(),0,7);o.fill()});o.globalAlpha=1}}
function pu(e){if(!dr)return;const[x,y]=pt(e),t=B.tool,c=CX(),d=dr;dr=null;
  if(t=='mv'){if(d.mv&&sel)pop('sel');else if(d.rect)lift(Math.min(d.x0,x),Math.min(d.y0,y),Math.abs(x-d.x0),Math.abs(y-d.y0));return}
  if(t=='hl'&&d.pts.length>1){snap();c.save();c.globalAlpha=.4;strokePts(c,d.pts,B.col,B.sz*U()*3);c.restore();clr()}
  else if(t=='sh'){clr();if(d.moved){snap();shape(c,d.x0,d.y0,x,y)}}
  else if(t=='ls'){setTimeout(clr,600)}
  else if(!d.moved&&(t=='tx'||t=='nt'))txDlg(x,y);
  else if(!d.moved&&t=='st'){snap();c.globalCompositeOperation='source-over';c.font=(50*U())+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(B.stk,x,y)}
  c.globalCompositeOperation='source-over'}
ov.addEventListener('pointerdown',pd);ov.addEventListener('pointermove',pm);ov.addEventListener('pointerup',pu);ov.addEventListener('pointercancel',pu);
addEventListener('resize',()=>{if(!$('#bd').hidden)fit()});
function txDlg(x,y){tp=[x,y];const d=$('#td');d.hidden=false;d.innerHTML=`<textarea id="tt" placeholder="${B.tool=='nt'?'اكتبي الملاحظة':'اكتبي النص'}" style="min-height:70px"></textarea><div class="row"><select id="tf" onchange="B.font=this.value">${FONTS.map(f=>`<option ${f==B.font?'selected':''} style="font-family:'${f}'" value="${f}">${f}</option>`).join('')}</select><input id="ts" type="number" value="${B.ts}" min="10" max="120"></div><div class="row"><button onclick="txOk()">إضافة</button><button class="g" onclick="$('#td').hidden=true">إلغاء</button></div>`;setTimeout(()=>{const t=$('#tt');if(t)t.focus()},60)}
async function txOk(){const t=$('#tt').value.trim();if(!t)return;B.ts=+$('#ts').value||26;const c=CX(),f=B.font,s=B.ts*U(),n=B.tool=='nt';$('#td').hidden=true;
  try{await document.fonts.load('700 '+s+'px "'+f+'"',t)}catch(e){}
  snap();c.globalCompositeOperation='source-over';c.font='700 '+s+'px "'+f+'",sans-serif';c.textAlign='center';c.textBaseline='top';
  const L=t.split('\n'),lh=s*1.45,w=Math.max(...L.map(l=>c.measureText(l).width)),[x,y]=tp,g=s*.5;
  if(n){c.fillStyle='#fde047';c.beginPath();if(c.roundRect)c.roundRect(x-w/2-g,y-g,w+g*2,lh*L.length+g*2,g);else c.rect(x-w/2-g,y-g,w+g*2,lh*L.length+g*2);c.fill()}
  c.fillStyle=n?'#1f2937':B.col;L.forEach((l,i)=>c.fillText(l,x,y+i*lh))}
function addImg(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const p=P(),c=CX(),k=Math.min(p.w*.6/m.width,p.h*.6/m.height);snap();c.globalCompositeOperation='source-over';c.drawImage(m,(p.w-m.width*k)/2,(p.h-m.height*k)/2,m.width*k,m.height*k)};m.src=r.result};r.readAsDataURL(f);i.value=''}
function comp(c,fit){const x=c.getContext('2d'),p=P();x.fillStyle=fit?'#000':p.bg;x.fillRect(0,0,c.width,c.height);const k=fit?Math.min(c.width/p.w,c.height/p.h):1,w=p.w*k,h=p.h*k,l=(c.width-w)/2,t=(c.height-h)/2;if(fit){x.fillStyle=p.bg;x.fillRect(l,t,w,h)}x.drawImage(p.c,l,t,w,h);x.drawImage(ov,l,t,w,h)}
async function pageFile(){commit();const p=P(),c=document.createElement('canvas');c.width=p.w;c.height=p.h;comp(c,0);const b=await new Promise(r=>c.toBlob(r,'image/png'));return new File([b],'sabora-'+(B.i+1)+'.png',{type:'image/png'})}
async function saveF(f){if(await nat(f))return;try{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast('تم الحفظ')}catch(e){toast('تعذّر الحفظ')}}
async function shareF(f){if(await nat(f))return;try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Miss Esoo'});return}}catch(e){if(e&&e.name=='AbortError')return}toast('المشاركة مش متاحة هنا، هنحاول نحفظ الملف');saveF(f)}
async function saveB(){saveF(await pageFile())}
async function shareB(){shareF(await pageFile())}
async function recToggle(){if(mr&&mr.state=='recording'){mr.stop();return}
  try{if(!window.MediaRecorder)throw 0;const p=P();rc=document.createElement('canvas');rc.width=p.w>=p.h?1280:720;rc.height=p.w>=p.h?720:1280;
    const loop=()=>{if(!rc)return;comp(rc,1);rl=requestAnimationFrame(loop)};loop();
    const vs=rc.captureStream(30);
    try{mst=await navigator.mediaDevices.getUserMedia({audio:true});mst.getAudioTracks().forEach(t=>vs.addTrack(t))}catch(e){mst=null;toast('الميكروفون مش متاح، التسجيل هيبقى بدون صوت')}
    const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    mr=new MediaRecorder(vs,mt?{mimeType:mt}:undefined);ch=[];
    mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    mr.onstop=()=>{cancelAnimationFrame(rl);clearInterval(rt);rc=null;if(mst)mst.getTracks().forEach(t=>t.stop());const b=$('#rb');b.textContent='⏺';b.classList.remove('rec');const ty=(mr.mimeType||mt||'video/webm').split(';')[0];recDone(new Blob(ch,{type:ty}),ty)};
    mr.start(1000);const t0=Date.now(),b=$('#rb');b.classList.add('rec');
    rt=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);b.textContent='⏹ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500)
  }catch(e){rc=null;cancelAnimationFrame(rl);toast('تسجيل الفيديو مش مدعوم في المتصفح ده')}}
function recDone(b,ty){RF=new File([b],'sharh-'+Date.now()+'.'+(ty.includes('mp4')?'mp4':'webm'),{type:ty});const m=$('#md');m.hidden=false;
  m.innerHTML=`<div class="card" style="width:100%;max-width:420px"><h3>تم التسجيل ✅</h3><video src="${URL.createObjectURL(b)}" controls playsinline style="width:100%;border-radius:12px;margin-bottom:8px"></video><p class="mut" style="margin:0 0 8px">من قائمة المشاركة اختاري واتساب أو ماسنجر أو يوتيوب.</p><div class="row"><button onclick="shareF(RF)">📤 مشاركة</button><button class="g" onclick="saveF(RF)">💾 حفظ</button></div><button class="g" style="width:100%;margin-top:8px" onclick="$('#md').hidden=true">إغلاق</button></div>`}

/* ===== الذكاء الاصطناعي عبر السيرفر الوسيط (يُستخدم في أي قسم) ===== */
async function aiCall(input,opts){
  const msgs=typeof input=='string'?[{role:'user',content:input}]:input,c=window.ME_CONFIG||{};
  if(!c.proxy||/YOUR-SUBDOMAIN/.test(c.proxy))throw{code:'no_proxy'};
  let r;try{r=await fetch(c.proxy.replace(/\/+$/,'').replace(/\/chat$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json','X-App-Token':c.token||''},body:JSON.stringify({messages:msgs,system:(opts&&opts.system)||undefined,max_tokens:(opts&&opts.max)||undefined})})}catch(e){throw{code:'network'}}
  if(!r.ok)throw{code:r.status==429?'rate_limited':r.status==401?'unauthorized':r.status==403?'forbidden':'http'};
  const j=await r.json(),o={text:j.text||''};if(opts&&opts.onText)opts.onText(o);return o}
function errMsg(e){const k=e&&e.code;return({no_proxy:'لسه مفيش رابط السيرفر. عدّلي ملف config.js.',network:'مفيش اتصال بالسيرفر. اتأكدي من الرابط والإنترنت.',rate_limited:'استني شوية وجرّبي تاني.',unauthorized:'الـ token غلط في config.js.',forbidden:'السيرفر رافض الموقع ده. راجعي ALLOWED_ORIGIN.'})[k]||'حصل خطأ، جرّبي تاني.'}
async function testAi(){const s=$('#aist');s.textContent='بجرّب…';try{const r=await aiCall('رُدّي بكلمة واحدة: تمام');s.textContent='✅ شغّال: '+r.text.slice(0,40)}catch(e){s.textContent='❌ '+errMsg(e)}}

/* ===== مشاركة وحفظ داخل تطبيق الأندرويد (Capacitor) ===== */
async function nat(f){const N=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()?Capacitor.Plugins:null;if(!N||!N.Share||!N.Filesystem)return false;
  try{const d=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
    const w=await N.Filesystem.writeFile({path:f.name,data:d,directory:'CACHE'});
    await N.Share.share({title:'Miss Esoo',url:w.uri,dialogTitle:'مشاركة أو حفظ'});return true}catch(e){return/cancel/i.test((e&&e.message)||'')}}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
showLock();
